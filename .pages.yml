content:
  - name: site-content
    label: "Site Content"
    type: file
    path: "content.json"
    format: json
    fields:
      - name: hero
        label: "Hero Section"
        type: object
        fields:
          - name: title
            label: "Hero Title"
            type: text
          - name: subtitle
            label: "Hero Subtitle"
            type: text
      - name: about
        label: "About Section"
        type: object
        fields:
          - name: text
            label: "About Me Paragraph"
            type: text
          - name: education
            label: "Education & Training"
            type: string
            list: true
