media:
  input: public
  output: /

content:
  - name: homepage
    label: "Homepage"
    type: file
    path: "src/content/homepage.json"
    fields:
      - name: badge
        label: "Badge Text"
        type: string
      - name: headline
        label: "Headline"
        type: string
      - name: subheadline
        label: "Subheadline"
        type: string
      - name: buttonText
        label: "Button Text"
        type: string
      - name: buttonUrl
        label: "Button URL"
        type: string