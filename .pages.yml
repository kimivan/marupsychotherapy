media:
  input: public
  output: /

content:
  - name: hero
    label: "Hero Banner"
    type: file
    path: "src/content/sections/hero.json"
    format: json
    fields:
      - name: headlinePre
        label: "Headline (Text Before Highlight)"
        type: string
      - name: headlineHighlight
        label: "Headline (Highlighted Text)"
        type: string
      - name: headlinePost
        label: "Headline (Text After Highlight)"
        type: string
      - name: subheadline
        label: "Subheadline"
        type: string
      - name: buttonText
        label: "Button Text"
        type: string
      - name: buttonUrl
        label: "Button URL"
        type: string

  - name: about
    label: "About Section"
    type: file
    path: "src/content/sections/about.json"
    format: json
    fields:
      - name: aboutImage
        label: "About Photo"
        type: image
      - name: aboutTitle
        label: "About Section Title"
        type: string
      - name: aboutSubtitle
        label: "About Section Subtitle"
        type: string
      - name: aboutBio
        label: "About Bio Text"
        type: text
      - name: aboutEducation
        label: "Education List"
        type: string
        list: true

  - name: services
    label: "Areas of Focus"
    type: file
    path: "src/content/sections/focus.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: items
        label: "Focus Areas"
        type: object
        list: true
        fields:
          - name: title
            label: "Area Title"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: svgPath
            label: "Icon SVG Path (Optional)"
            type: string

  - name: approach
    label: "Approach"
    type: file
    path: "src/content/sections/approach.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: items
        label: "Approach Items"
        type: object
        list: true
        fields:
          - name: title
            label: "Item Title"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: svgPath
            label: "Icon SVG Path (Optional)"
            type: string
            
  - name: location
    label: "Location & Logistics"
    type: file
    path: "src/content/sections/location.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: introText
        label: "Introductory Paragraph"
        type: text
      - name: details
        label: "Detail Blocks (Address, Rate, Insurance, etc.)"
        type: object
        list: true
        fields:
          - name: label
            label: "Block Title / Label"
            type: string
          - name: text
            label: "Block Description / Text"
            type: text