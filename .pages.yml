media:
  input: public
  output: /

content:
  - name: homepage
    label: "Homepage"
    type: file
    path: "src/content/homepage.json"
    format: json
    fields:
      - name: headlinePre
        label: "Headline (Text Before Highlight)"
        type: string
      - name: headlineHighlight
        label: "Headline (Highlighted Text)"
        type: string
      - name: headlinePost
        label: "Headline (Text After Highlight)"
        type: string
      - name: subheadline
        label: "Subheadline"
        type: string
      - name: buttonText
        label: "Button Text"
        type: string
      - name: buttonUrl
        label: "Button URL"
        type: string
      - name: aboutImage
        label: "About Photo"
        type: image
      - name: aboutTitle
        label: "About Section Title"
        type: string
      - name: aboutSubtitle
        label: "About Section Subtitle"
        type: string
      - name: aboutBio
        label: "About Bio Text"
        type: text
      - name: aboutBlocks
        label: "Info Blocks (Education, Certifications, etc.)"
        type: list
        fields:
          - name: title
            label: "Block Title (e.g. Education, Certifications)"
            type: string
          - name: items
            label: "Bullet Points"
            type: list
            field:
              label: "Item Text"
              type: string