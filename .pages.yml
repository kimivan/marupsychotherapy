media:
  input: public
  output: /

content:
  - name: site
    label: "SEO & Site Metadata"
    type: file
    path: "src/content/sections/site.json"
    format: json
    fields:
      - name: siteTitle
        label: "Browser Tab Title"
        type: string
      - name: siteDescription
        label: "Meta Description (SEO & Social Sharing)"
        type: text
      - name: siteUrl
        label: "Canonical Website URL"
        type: string
      - name: faviconSvg
        label: "Favicon SVG File"
        type: image
      - name: faviconIco
        label: "Favicon ICO File"
        type: image
      - name: appleTouchIcon
        label: "Apple Touch Icon File"
        type: image

  - name: hero
    label: "Hero Section"
    type: file
    path: "src/content/sections/hero.json"
    format: json
    fields:
      - name: headlinePre
        label: "Headline Pre"
        type: string
      - name: headlineHighlight
        label: "Headline Highlight"
        type: string
      - name: headlinePost
        label: "Headline Post"
        type: string
      - name: subheadline
        label: "Subheadline"
        type: text
      - name: buttonText
        label: "Button Text"
        type: string
      - name: buttonUrl
        label: "Button URL"
        type: string

  - name: about
    label: "About Section"
    type: file
    path: "src/content/sections/about.json"
    format: json
    fields:
      - name: image
        label: "Image"
        type: image
      - name: title
        label: "Title"
        type: string
      - name: subtitle
        label: "Subtitle"
        type: string
      - name: bio
        label: "Bio"
        type: text
      - name: education
        label: "Education"
        type: list
        field:
          type: string

  - name: focus
    label: "Clinical Focus"
    type: file
    path: "src/content/sections/focus.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: items
        label: "Focus Areas"
        type: object
        list: true
        fields:
          - name: title
            label: "Item Title"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: svgPath
            label: "Icon SVG Path"
            type: string

  - name: approach
    label: "Approach"
    type: file
    path: "src/content/sections/approach.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: items
        label: "Approach Items"
        type: object
        list: true
        fields:
          - name: title
            label: "Item Title"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: svgPath
            label: "Icon SVG Path (Optional)"
            type: string

  - name: location
    label: "Location & Logistics"
    type: file
    path: "src/content/sections/location.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: introText
        label: "Introductory Paragraph"
        type: text
      - name: details
        label: "Detail Blocks (Address, Rate, Insurance, etc.)"
        type: object
        list: true
        fields:
          - name: label
            label: "Block Title / Label"
            type: string
          - name: text
            label: "Block Description / Text"
            type: text

  - name: faqs
    label: "FAQs"
    type: file
    path: "src/content/sections/faqs.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: questions
        label: "FAQ Items"
        type: object
        list: true
        fields:
          - name: question
            label: "Question"
            type: string
          - name: answer
            label: "Answer (Markdown supported for lists/links)"
            type: rich-text

  - name: consultation
    label: "Schedule Consultation"
    type: file
    path: "src/content/sections/consultation.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: description
        label: "Description (Markdown supported for links)"
        type: rich-text
      - name: showDisclaimer
        label: "Show Crisis Disclaimer"
        type: boolean
      - name: disclaimerText
        label: "Disclaimer Text"
        type: text
      - name: buttonText
        label: "Button Text"
        type: string
      - name: buttonUrl
        label: "Button Link URL"
        type: string

  - name: footer
    label: "Footer"
    type: file
    path: "src/content/sections/footer.json"
    format: json
    fields:
      - name: contactLabel
        label: "Contact Label"
        type: string
      - name: email
        label: "Contact Email"
        type: string
      - name: followLabel
        label: "Follow Label"
        type: string
      - name: socialName
        label: "Social Platform Name"
        type: string
      - name: socialUrl
        label: "Social Profile URL"
        type: string
        