- name: approach
    label: "Approach"
    type: file
    path: "src/content/sections/approach.json"
    format: json
    fields:
      - name: title
        label: "Section Title"
        type: string
      - name: subtitle
        label: "Section Subtitle"
        type: string
      - name: items
        label: "Approach Items"
        type: object
        list: true
        fields:
          - name: title
            label: "Item Title"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: svgPath
            label: "Icon SVG Path (Optional)"
            type: string